<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <radialGradient id="cream" cx="50%" cy="42%" r="62%">
      <stop offset="0" stop-color="#fffdf5"/>
      <stop offset="1" stop-color="#e8dfc9"/>
    </radialGradient>
    <radialGradient id="pizza" cx="50%" cy="42%" r="62%">
      <stop offset="0" stop-color="#ffd77f"/>
      <stop offset=".72" stop-color="#e9a14b"/>
      <stop offset="1" stop-color="#9f4d1e"/>
    </radialGradient>
    <radialGradient id="cheese" cx="48%" cy="42%" r="65%">
      <stop offset="0" stop-color="#fff8c9"/>
      <stop offset=".75" stop-color="#f6dd8d"/>
      <stop offset="1" stop-color="#e9b85d"/>
    </radialGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#173b34"/>
      <stop offset="1" stop-color="#071f1b"/>
    </linearGradient>
    <linearGradient id="oil" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f5c84b"/>
      <stop offset="1" stop-color="#8d5a08"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <path id="topArc" d="M 210 455 A 430 430 0 0 1 990 455"/>
  </defs>

  <!-- Circular emblem -->
  <g filter="url(#shadow)">
    <circle cx="600" cy="600" r="555" fill="#0d3c32"/>
    <circle cx="600" cy="600" r="540" fill="url(#cream)" stroke="#c8a75b" stroke-width="6"/>
    <circle cx="600" cy="600" r="520" fill="none" stroke="#c71920" stroke-width="9"/>
    <path d="M115 820 A540 540 0 0 0 370 1095 L435 1005 A430 430 0 0 1 230 785Z" fill="#008c45"/>
    <path d="M1085 820 A540 540 0 0 1 830 1095 L765 1005 A430 430 0 0 0 970 785Z" fill="#d71920"/>
    <path d="M115 380 A540 540 0 0 1 300 135 L360 240 A430 430 0 0 0 215 445Z" fill="#008c45"/>
    <path d="M1085 380 A540 540 0 0 0 900 135 L840 240 A430 430 0 0 1 985 445Z" fill="#d71920"/>

    <!-- Top title -->
    <text font-family="Georgia,serif" font-size="128" font-weight="700" fill="#102b26" letter-spacing="18">
      <textPath href="#topArc" startOffset="50%" text-anchor="middle">PIZZE</textPath>
    </text>

    <!-- Oven -->
    <path d="M275 600 Q300 265 600 215 Q900 265 925 600Z" fill="#26140e" stroke="#c79a4b" stroke-width="7"/>
    <path d="M330 590 Q355 325 600 285 Q845 325 870 590Z" fill="#6d3520"/>
    <ellipse cx="600" cy="460" rx="190" ry="150" fill="#1a0c08"/>
    <path d="M475 500 Q525 325 600 365 Q675 325 730 500 Q675 565 600 550 Q525 565 475 500Z" fill="#f36b16"/>
    <path d="M520 490 Q560 370 600 445 Q640 350 685 490 Q650 530 600 520 Q550 530 520 490Z" fill="#ffd34a"/>
    <path d="M570 490 Q590 400 610 470 Q630 400 650 490 Q625 520 600 510 Q580 520 570 490Z" fill="#fff4a3"/>

    <!-- Pizza -->
    <circle cx="600" cy="625" r="335" fill="url(#pizza)" stroke="#6f3118" stroke-width="9"/>
    <circle cx="600" cy="625" r="278" fill="#bd3f22"/>
    <circle cx="600" cy="625" r="255" fill="url(#cheese)"/>

    <!-- Sauce patches -->
    <g fill="#c9281d">
      <ellipse cx="455" cy="510" rx="75" ry="40"/>
      <ellipse cx="660" cy="470" rx="82" ry="44"/>
      <ellipse cx="760" cy="630" rx="72" ry="42"/>
      <ellipse cx="540" cy="745" rx="92" ry="45"/>
      <ellipse cx="400" cy="650" rx="65" ry="42"/>
    </g>

    <!-- Mozzarella -->
    <g fill="#fff9df" stroke="#ead9a7" stroke-width="4">
      <ellipse cx="535" cy="500" rx="48" ry="35"/>
      <ellipse cx="690" cy="560" rx="56" ry="40"/>
      <ellipse cx="575" cy="650" rx="58" ry="43"/>
      <ellipse cx="465" cy="610" rx="50" ry="35"/>
      <ellipse cx="650" cy="735" rx="55" ry="38"/>
    </g>

    <!-- Tomatoes -->
    <g fill="#e83424" stroke="#a91e16" stroke-width="5">
      <circle cx="430" cy="520" r="31"/>
      <circle cx="710" cy="475" r="34"/>
      <circle cx="790" cy="625" r="30"/>
      <circle cx="520" cy="760" r="32"/>
      <circle cx="420" cy="670" r="27"/>
    </g>
    <g fill="#ffd65d">
      <circle cx="430" cy="520" r="8"/><circle cx="710" cy="475" r="8"/>
      <circle cx="790" cy="625" r="8"/><circle cx="520" cy="760" r="8"/>
    </g>

    <!-- Basil -->
    <g fill="#198d45" stroke="#075d2c" stroke-width="4">
      <ellipse cx="535" cy="430" rx="22" ry="55" transform="rotate(35 535 430)"/>
      <ellipse cx="650" cy="520" rx="24" ry="60" transform="rotate(-35 650 520)"/>
      <ellipse cx="715" cy="680" rx="22" ry="57" transform="rotate(40 715 680)"/>
      <ellipse cx="515" cy="625" rx="23" ry="55" transform="rotate(-40 515 625)"/>
      <ellipse cx="600" cy="790" rx="22" ry="54" transform="rotate(25 600 790)"/>
    </g>

    <!-- Char marks on crust -->
    <g fill="#2b1712" opacity=".92">
      <ellipse cx="405" cy="380" rx="14" ry="28" transform="rotate(-40 405 380)"/>
      <ellipse cx="510" cy="335" rx="13" ry="26" transform="rotate(-15 510 335)"/>
      <ellipse cx="650" cy="332" rx="14" ry="28" transform="rotate(20 650 332)"/>
      <ellipse cx="780" cy="405" rx="13" ry="28" transform="rotate(45 780 405)"/>
      <ellipse cx="865" cy="550" rx="14" ry="27" transform="rotate(80 865 550)"/>
      <ellipse cx="820" cy="745" rx="14" ry="27" transform="rotate(135 820 745)"/>
      <ellipse cx="670" cy="875" rx="14" ry="28" transform="rotate(20 670 875)"/>
      <ellipse cx="490" cy="855" rx="13" ry="27" transform="rotate(-25 490 855)"/>
      <ellipse cx="335" cy="710" rx="14" ry="28" transform="rotate(55 335 710)"/>
    </g>

    <!-- Olive oil bottle -->
    <g transform="translate(850 355)">
      <path d="M70 0 h48 l10 42 h18 v135 q0 35-35 35H78q-35 0-35-35V42h17z" fill="url(#oil)" stroke="#70470b" stroke-width="6"/>
      <rect x="70" y="-12" width="48" height="25" rx="8" fill="#b6873c"/>
      <path d="M48 68 h96" stroke="#f6d66c" stroke-width="8" opacity=".65"/>
    </g>

    <!-- Main ribbon -->
    <path d="M65 735 Q300 655 600 710 Q900 655 1135 735 L1080 940 Q840 900 600 925 Q360 900 120 940Z"
          fill="url(#ribbon)" stroke="#c8a75b" stroke-width="10"/>
    <path d="M115 760 Q310 700 600 748 Q890 700 1085 760" fill="none" stroke="#f7ecd4" stroke-width="3" opacity=".55"/>

    <text x="600" y="855" text-anchor="middle"
          font-family="Brush Script MT, Segoe Script, cursive"
          font-size="150" font-weight="700" fill="#fff7e6" stroke="#c8a75b" stroke-width="2">
      il Napolitano
    </text>
    <path d="M430 882 Q520 855 595 880" fill="none" stroke="#008c45" stroke-width="9" stroke-linecap="round"/>
    <path d="M610 880 Q735 850 830 880" fill="none" stroke="#d71920" stroke-width="9" stroke-linecap="round"/>

    <!-- Bottom descriptor -->
    <text x="600" y="1025" text-anchor="middle" font-family="Arial,sans-serif"
          font-size="31" font-weight="700" letter-spacing="11" fill="#182b28">PIZZA NAPOLITANA</text>
    <text x="600" y="1070" text-anchor="middle" font-family="Arial,sans-serif"
          font-size="26" font-weight="600" letter-spacing="9" fill="#182b28">AUTÉNTICA</text>

    <!-- crossed pizza peels -->
    <g stroke="#183b34" stroke-width="12" stroke-linecap="round">
      <path d="M555 1105 L650 1015"/>
      <path d="M645 1105 L550 1015"/>
    </g>
    <g fill="#183b34">
      <path d="M525 1015 q25-35 55 0 v28 q-28 18-55 0z"/>
      <path d="M620 1015 q25-35 55 0 v28 q-28 18-55 0z"/>
    </g>
  </g>
</svg>